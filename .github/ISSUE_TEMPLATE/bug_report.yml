name: Relato de bug
description: Algo não funcionou como esperado
labels: ["bug"]
body:
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu
      description: Descreva o problema e o que você esperava.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. python main.py clean --dry-run
        2. ...
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Versão do Windows
      description: Aparece em `python main.py info`.
    validations:
      required: true
  - type: dropdown
    id: forma
    attributes:
      label: Como você rodou
      options:
        - Executável ou instalador
        - Código-fonte
    validations:
      required: true
  - type: dropdown
    id: admin
    attributes:
      label: Rodou como Administrador?
      options:
        - Sim
        - Não
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Trecho de `system_boost.log`. Confira se não há dados pessoais antes de colar.
      render: text
