[project]
name = "system-boost"
version = "0.1.0"
description = "Windows CLI that cleans temporary files and applies reversible tweaks"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"frontend/cli.py" = ["F401"]  # re-exports for main.py
